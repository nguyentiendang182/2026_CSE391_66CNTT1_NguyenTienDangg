<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đơn Đặt Hàng Nâng Cao</title>
    <link rel="stylesheet" href="style22_04.css">
</head>
<body>

<div class="container">
    <h2>🛒 Đơn Đặt Hàng</h2>
    <form id="orderForm" novalidate>
        <div class="form-group">
            <label for="product">Sản phẩm *</label>
            <select id="product">
                <option value="">-- Chọn sản phẩm --</option>
                <option value="laptop">Laptop Gaming (25.000.000đ)</option>
                <option value="mouse">Chuột Không Dây (500.000đ)</option>
                <option value="keyboard">Bàn Phím Cơ (1.200.000đ)</option>
            </select>
            <span class="error-message" id="product-error"></span>
        </div>

        <div class="form-group">
            <label for="quantity">Số lượng (1-99) *</label>
            <input type="number" id="quantity" placeholder="Nhập số lượng..." min="1" max="99">
            <span class="error-message" id="quantity-error"></span>
        </div>

        <div class="form-group">
            <label for="deliveryDate">Ngày giao hàng *</label>
            <input type="date" id="deliveryDate">
            <span class="error-message" id="deliveryDate-error"></span>
        </div>

        <div class="form-group">
            <label for="address">Địa chỉ giao hàng *</label>
            <input type="text" id="address" placeholder="Ít nhất 10 ký tự...">
            <span class="error-message" id="address-error"></span>
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="note">Ghi chú (Tùy chọn)</label>
                <span id="charCount">0/200</span>
            </div>
            <textarea id="note" rows="3" placeholder="Yêu cầu thêm..."></textarea>
            <span class="error-message" id="note-error"></span>
        </div>

        <div class="form-group">
            <label>Phương thức thanh toán *</label>
            <div class="radio-group">
                <label><input type="radio" name="payment" value="COD"> COD</label>
                <label><input type="radio" name="payment" value="Chuyển khoản"> Chuyển khoản</label>
                <label><input type="radio" name="payment" value="Ví điện tử"> Ví điện tử</label>
            </div>
            <span class="error-message" id="payment-error"></span>
        </div>

        <div class="total-section">
            Tổng cộng: <span id="totalPrice">0đ</span>
        </div>

        <button type="submit" id="btnSubmit">Đặt Hàng Ngay</button>
    </form>
</div>

<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>Xác nhận đơn hàng?</h3>
        <div id="summaryDetails"></div>
        <div class="modal-actions">
            <button id="btnCancel" class="btn-secondary">Hủy</button>
            <button id="btnFinalConfirm" class="btn-primary">Xác nhận</button>
        </div>
    </div>
</div>

<div id="successMsg" class="success-overlay hidden">
    <div class="success-box">
        <h2>🎉 Đặt hàng thành công!</h2>
        <p>Cảm ơn bạn đã tin tưởng dịch vụ của chúng tôi.</p>
        <button onclick="location.reload()">Quay lại</button>
    </div>
</div>

<script src="script22_04.js"></script>
</body>
</html>
